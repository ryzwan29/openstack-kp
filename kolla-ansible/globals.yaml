kolla_base_distro: "ubuntu"
openstack_release: "2026.2"

kolla_internal_vip_address: "192.168.19.63"

neutron_plugin_agent: "ovn"
network_interface: "eth0"           # management
tunnel_interface: "eth1"            # internal
storage_interface: "eth2"           # storage
neutron_external_interface: "ens22" # external

enable_haproxy: "no"
enable_keepalived: "no"

enable_cinder: "yes"
enable_horizon: "yes"

# iscsi backend
enable_iscsid: "yes"
enable_multipathd: "yes"
glance_file_datadir_volume: "/mnt/glance"
enable_cinder_backend_iscsi: "yes"
skip_cinder_backend_check: "yes"
enable_cinder_backup: "no"

cinder_volume_image_full: "ghcr.io/ryzwan29/cinder-volume:2026.2-noble"

# ceph backend 
glance_backend_ceph: "yes"
cinder_backend_ceph: "yes"
nova_backend_ceph: "no"

ceph_cinder_user: "cinder"
ceph_glance_user: "glance"
ceph_cinder_pool_name: "volumes"
ceph_glance_pool_name: "images"